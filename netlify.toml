# Netlify configuration for the Indiana County Civic Guide (written 2026-11-09 by the security review; nothing is
# connected or deployed). Hosting target 2 in planning/build-plan.md: "Netlify static. Same output". Public hosting
# happens only on Nick's explicit deploy trigger.
#
# Publish directory: site/st-joseph (the St. Joseph County edition, served at the domain root).
# Deploy method (Nick, 2026-11-09): Git-connected auto-deploy. Netlify's PRODUCTION BRANCH IS `production`, not
# main (same as Nick's other projects): a push to main never goes live; updating `production` is the deploy, done
# only on Nick's explicit deploy trigger. site/ is git-ignored except the 11 images the pages show
# (site/images/thumb_*.jpg + Hiler's portrait; see .gitignore), so the build below runs from a clean clone; tested
# 2026-11-09 from a fresh clone: --check PASSED, netlify_prep CSP check passed, 25 MB published.
# Fallback (no Git): build locally with the two commands below, then `netlify deploy --dir site/st-joseph`.
#
# Headers (security headers + Content-Security-Policy, caching) live in tools/site/netlify/_headers and are copied
# into the publish directory by netlify_prep.py, because a _headers file in the published folder is honored by every
# deploy method, including drag-and-drop. Do not add [[headers]] here as well: two sources would drift.
# netlify_prep.py also turns the Artifact-host fragment index.html into a full document and writes 404.html.

[build]
  publish = "site/st-joseph"
  command = "python -P -E tools/site/build.py --edition st-joseph --check && python -P -E tools/site/netlify_prep.py site/st-joseph"

[build.environment]
  # the generator is developed and tested on Python 3.13 (standard library only, no requirements file)
  PYTHON_VERSION = "3.13"
